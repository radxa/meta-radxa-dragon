#@TYPE: Machine
#@NAME: qcs6490-radxa-dragon-q6a
#@DESCRIPTION: Machine configuration for Radxa Dragon Q6A with QCS6490

require conf/machine/include/qcom-qcs6490.inc

MACHINE_FEATURES = "usbhost usbgadget alsa wifi bluetooth"

# AIC8800D80 WiFi/BT 固件 (USB)，配合内核 in-tree 驱动
# (CONFIG_AIC8800_WLAN_SUPPORT / CONFIG_BT_AIC_BTUSB)。
# 用 RRECOMMENDS 软依赖，随 kernel-modules 进同一镜像。
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " wifibt-firmware-aic8800d80-usb"

# QUP GENI SE 固件 qupv3fw.elf 装入 rootfs：本板部分 i2c/uart/spi SE 未被
# bootloader 预配协议，需声明 qcom,load-firmware 由内核 geni 从
# /lib/firmware/qupv3fw.elf 加载固件后总线方能上线（upstream linux-firmware
# 无 qcs6490 版，故由本层 qcom-qupv3fw-rootfs 从 firmware-qcom-bootbins 取出装入）。
# 板级常备能力，软依赖随镜像进。
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " qcom-qupv3fw-rootfs"

KERNEL_DEVICETREE:pn-linux-qcom-custom = " \
                      qcom/qcs6490-radxa-dragon-q6a.dtb \
                      "

# Additional dtbo to overylay on top of kernel devicetree files
KERNEL_TECH_DTBOS[qcs6490-radxa-dragon-q6a] = " \
    qcm6490-graphics.dtbo \
    qcm6490-video.dtbo \
    "
# Recipe providers of above dtbo files.
KERNEL_TECH_DTBO_PROVIDERS = "\
    qcom-graphicsdevicetree \
    qcom-videodtb \
"

# ── dtb 修复（fix-dtb-via-ostree-devicetree）─────────────────────────────
# 病灶：UEFI 内嵌旧 stock dtb 经 EFI 配置表交给内核，USB/GPU/VPU/display 全废。
# 修法：让 OSTree 把正确 dtb 部署进启动目录，并在 systemd-boot 启动条目写出
#       devicetree 行覆盖固件内嵌树（内核 EFI-stub 改从配置表用此树）。
#
# 必须用 :forcevariable —— distro qcom-base.inc 硬赋值 OSTREE_DEPLOY_DEVICETREE="0"、
#   OSTREE_DEVICETREE="${KERNEL_DEVICETREE}"，且 distro 解析在 machine 之后，普通 = 会被盖回。
# 指向 combined-dtb.dtb（已合并 qcm6490-graphics/video.dtbo 的完整树），由本层
#   linux-qcom-mergedtb 的 do_deploy 投到 DEPLOY_DIR_IMAGE；ostree-kernel-initramfs
#   以 basename 取用。注意 OSTREE_DEVICETREE 默认值在该配方里为空（KERNEL_DEVICETREE
#   是 :pn-linux-qcom-custom 限定），故必须显式指定。
OSTREE_DEPLOY_DEVICETREE:forcevariable = "1"
OSTREE_DEVICETREE:forcevariable = "combined-dtb.dtb"
