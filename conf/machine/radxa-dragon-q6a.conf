#@TYPE: Machine
#@NAME: Radxa Dragon Q6A
#@DESCRIPTION: Machine configuration for the Radxa Dragon Q6A with QCS6490

require conf/machine/include/qcom-qcs6490.inc

MACHINE_FEATURES += "efi m2connector pci"

PREFERRED_PROVIDER_virtual/kernel = "linux-qcom"

KERNEL_DEVICETREE ?= " \
    qcom/qcs6490-radxa-dragon-q6a.dtb \
"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    packagegroup-radxa-dragon-q6a-firmware \
    packagegroup-radxa-dragon-q6a-hexagon-dsp-binaries \
    qairt-sdk-hexagon-v68 \
    qcom-fastcv-binaries-thundercomm-rb3gen2-dsp \
"

# The Q6A SPI NOR already contains the Qualcomm boot chain and UEFI. This
# machine intentionally does not define a qcomflash boot-firmware payload.
# Its bootable SD image starts at the EFI System Partition.

# Isolate the real-time CPU in the same way as the other QCS6490 platforms.
QCOM_RT_CPU        = "7"
QCOM_IRQAFF        = "0-6"
QCOM_RCU_NOCBS     = "7"
QCOM_RCU_EXPEDITED = "1"
QCOM_CPUIDLE_OFF   = "1"
