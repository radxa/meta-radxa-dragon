#@TYPE: Machine
#@NAME: Radxa VMARC-Q9075 IO based on QCS9075
#@DESCRIPTION: Machine configuration for Radxa VMARC-Q9075 IO board

require conf/machine/include/qcom-qcs9100.inc

MACHINE_FEATURES += "efi kvm m2connector pci tpm2 phone"

KERNEL_DEVICETREE ?= " \
                      qcom/lemans-radxa-vmarc-q9075-io.dtb \
                      "

# These DTs are not upstreamed and currently exist only in linux-qcom kernels
LINUX_QCOM_KERNEL_DEVICETREE ?= " \
                      qcom/lemans-el2.dtbo \
                      "

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    packagegroup-radxa-vmarc-q9075-io-firmware \
    packagegroup-radxa-vmarc-q9075-io-hexagon-dsp-binaries \
    qairt-sdk-hexagon-v73 \
    qcom-fastcv-binaries-sa8775p-ride-dsp \
"

QCOM_CDT_FILE = "cdt_radxa_vmarc_q9075_io"
QCOM_BOOT_FILES_SUBDIR = "qcs9100"
QCOM_PARTITION_FILES_SUBDIR ?= "partitions/iq-9075-evk/ufs"

QCOM_BOOT_FIRMWARE = "firmware-qcom-boot-qcs9075-radxa-vmarc-q9075-io"
QCOM_CDT_FIRMWARE = "firmware-qcom-cdt-qcs9100"

# Isolate rt cpu
QCOM_RT_CPU        = "7"
QCOM_IRQAFF        = "0-6"
QCOM_RCU_NOCBS     = "7"
QCOM_RCU_EXPEDITED = "1"
QCOM_CPUIDLE_OFF   = "1"

UBOOT_CONFIG = "iq-9075-evk"
